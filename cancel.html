<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>予約キャンセル</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; padding-top: 80px; }
    .item { margin-bottom: 10px; text-align: left; }
    .btn {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 20px;
      width: 100%;
      font-size: 16px;
    }

    /* ==================================================
       ▼ ローディング設定（初期状態を非表示に修正）
       ================================================== */
    #loading {
      display: none; /* ★ ここを none にすることで、最初は非表示にします */
    }
                 
    .loader {                                    
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }
                                               
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }

    #loading p {
      font-size: 60px;
    }
  </style>
</head>
<body>

<h2>予約キャンセル</h2>

<div id="loading">
  <div class="loader">
    <span></span><span></span><span></span>
  </div>
  <p>読み込み中です…</p>
</div>

<div id="list"></div>

<button id="cancelBtn" class="btn">選択した予約をキャンセルする</button>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="cancel.js"></script>

</body>
</html>
