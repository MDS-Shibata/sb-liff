<!DOCTYPE html>         
<html lang="ja">       
<head>                  
  <meta charset="UTF-8"> 
  <title>SB予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    /* ローディング全体（最初は非表示） */
    #loading {
      display: none;
    }
                 
    /* 3つの点のアニメーション */
                                      /*display: flex;この要素をフレックスコンテナ（Flexbox）に変えます。中に含まれる子要素（アニメーションの点や輪など）の配置を
                                                     簡単にコントロールできるようになります。
                                      justify-content: center;中の子要素を、水平方向（主軸）の真ん中に集めて配置します。
                                      margin-bottom: 20px;このローディング領域自体の**下に20pxの隙間（外側余白）**を空けます。これにより、
                                                          下部に続くテキストやコンテンツとくっついてしまうのを防ぎます*/  
    .loader {                                    
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }
                                               
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }

                                   /*@keyframes bounce: bounce（バウンス）という名前のアニメーションを定義します。
                                    from { transform: translateY(0); }: アニメーションの開始時点（0%）では、要素を元の位置（Y軸方向に0）に配置します。
                                    to { transform: translateY(-30px); }: アニメーションの終了時点（100%）では、要素を上方向に30ピクセル移動させます*/
     #loading p {
    font-size: 60px;
  }
  </style>
</head>

<body>

   <!-- ▼ 注意事項（最初に表示） -->
<div id="notice" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
">
  <div style="
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 85%;
    text-align: left;
    font-size: 40px;
    line-height: 1.6;
  ">
    <h2 style="text-align:center;">ご利用前の注意事項</h2>
    <p>・予約は乗車日の<span style="color:red;">前日午後３時まで</span> にお願いします</p>
    <p>・（月曜に乗車の時は土曜の午後３時まで）</p>
    <p>・予約は必ず<span style="color:red;"> ご自身のスマホ</span>で行ってください</p>
    <p>・初回予約時は教習生番号の打ち間違いに気をつけて下さい</p>

    <button id="notice-ok" style="
      margin-top: 20px;
      width: 100%;
      padding: 30px;
      font-size: 40px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
    ">OK</button>
  </div>
</div>

  
  <!-- ローディング表示（最初は非表示） -->
  <div id="loading">
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
    <p>読み込み中です…</p>
  </div>

  <script>                                    /*コンピュータに特定の処理を実行させるための「簡易的なプログラム」や「命令を記述したテキストファイル*/

    const LIFF_ID = "2010140886-GXbWv0ge";   /*const⇒constant（定数・不変）」に由来するプログラミング用語です。一度設定した値を後から変更（再代入）できない変数*/

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxzWD6UOabRxD9j6XLtznNoKTQYAxK-4DJcWrGdrsDGKj44lZ793stUE1zKmvRz8P-h/exec";

    // ▼ ページ読み込み時に LIFF を初期化する
window.onload = async () => {
  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }
};

    async function main() {
                                              /*JavaScript（またはTypeScript）で非同期処理（await）を伴う一連のプログラムを、
                                                一番最初の開始点（メイン関数）として実行するための関数定義*/

      
    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") || "";

      // ★ ローディング表示（ここで初めて表示される）
      document.getElementById("loading").style.display = "block";
                                              /*document.getElementById("loading")HTMLの中から、id="loading" という目印（ID）がつけられた要素（タグ）を検索して取得します。
                                              .style取得した要素に対して、CSS（見た目の装飾）を操作するための設定を開きます。
                                                                        ※ CSS（Cascading Style Sheets）とは、
                                                                           Webページの「見た目」や「レイアウト」をデザインするためのスタイルシート言語
                                              .displayCSSの display プロパティ（要素の表示・非表示を切り替える設定）を指定します。
                                              = "block"その要素の表示形式を block（ブロックレベル要素として表示する）に変更し、画面上に表示させます。*/
    


                                             

      if (!liff.isLoggedIn()) {                /*ユーザーがLINEアカウントにログインしていない場合*/

        liff.login();
        return;                                /*処理を終了し、その結果（戻り値）を呼び出し元に返す*/

      }

      // プロフィール取得
      const profile = await liff.getProfile();   /*現在アクセスしているLINEユーザーのプロフィール情報（名前、アイコン画像、ユーザーIDなど）を取得するためのコード*/

      const userId = profile.userId;             /*取得したユーザーのプロフィール情報（profile）の中から、個人の識別番号であるユーザーID（userId）を取り出し、
                                                   再代入できない変数（userId）に保存する*/




      // GAS に userId を送信
   const url = GAS_URL
  + "?userId=" + encodeURIComponent(userId)
  + "&mode=" + encodeURIComponent(mode);

       const res = await fetch(url, { method: "GET" });
                               
      const data = await res.json();                                   /*サーバーから取得したデータ（文字列）を、JavaScriptで扱えるオブジェクトや配列に変換し、変数 data に格納する処理*/
                                                                       /*非同期処理：パース（変換）には少し時間がかかるため、await をつけて処理が完了するのを待ちます。
                                                                         JSONとは：Web上でデータをやり取りするためのテキスト形式です。これを res.json()  (res=response) によって、
                                                                        .name や .id のようにドットでアクセスできる通常のオブジェクトに変換します*/

      // ★ ローディングを非表示にする
document.getElementById("loading").style.display = "none";

if (data.prefillUrl) {
  liff.openWindow({ url: data.prefillUrl, external: true });
 liff.closeWindow();
} else {
  alert("IDが取得できません");
}

}      
  


       // 注意事項を閉じたら main() を実行
document.getElementById("notice-ok").onclick = () => {
  document.getElementById("notice").style.display = "none";
  
  main();
};

 </script>

 
</body>
     


</html>
