<!DOCTYPE html>         /*このファイルは最新のHTML（HTML5）で書かれています*/
<html lang="ja">        /*このWebページの主な言語は日本語です*/
<head>                  /*Webページの裏側の設定情報を記述する場所*/
  <meta charset="UTF-8">
  <title>SB予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h2>読み込み中...</h2>

  <script>
    const LIFF_ID = "2010140886-GXbWv0ge"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycby4ZPyq7Sc51WNAqZEKknwW0U4dBuWjYEAZTtQYJd8lQiBwTlxinWamPJMeDBPw-Sr-/exec"; // doGet のURL
    async function main() {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      // GAS に userId を送信
      const url = GAS_URL + "?userId=" + encodeURIComponent(userId);

      const res = await fetch(url);
      const data = await res.json();

      if (data.prefillUrl) {
        location.href = data.prefillUrl;
      } else {
        alert("URL取得に失敗しました");
      }
    }

    main();
  </script>
</body>
</html>
