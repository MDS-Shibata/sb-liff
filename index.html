<!DOCTYPE html>         
<html lang="ja">       
<head>                  
  <meta charset="UTF-8"> 
  <title>SB予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    /* ローディング全体（最初は非表示） */
    #loading {
      display: none;
    }

    /* 3つの点のアニメーション */
    .loader {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }
     #loading p {
    font-size: 60px;
  }
  </style>
</head>

<body>

  <!-- ローディング表示（最初は非表示） -->
  <div id="loading">
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
    <p>読み込み中です…</p>
  </div>

  <script>
    const LIFF_ID = "2010140886-GXbWv0ge";
    const GAS_URL = "https://script.google.com/macros/s/AKfycby4ZPyq7Sc51WNAqZEKknwW0U4dBuWjYEAZTtQYJd8lQiBwTlxinWamPJMeDBPw-Sr-/exec";

    async function main() {

      // ★ ローディング表示（ここで初めて表示される）
      document.getElementById("loading").style.display = "block";

      // LIFF 初期化
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      // プロフィール取得
      const profile = await liff.getProfile();
      const userId = profile.userId;

      // GAS に userId を送信
      const url = GAS_URL + "?userId=" + encodeURIComponent(userId);
      const res = await fetch(url);
      const data = await res.json();

      if (data.prefillUrl) {
        location.href = data.prefillUrl;
      } else {
        alert("URL取得に失敗しました");
      }
    }

    main();
  </script>
</body>
</html>
