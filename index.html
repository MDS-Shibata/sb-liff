<!DOCTYPE html>         
<html lang="ja">       
<head>                  
  <meta charset="UTF-8"> 
  <title>SB予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    /* ローディング全体（最初は非表示） */
    #loading {
      display: none;
    }
                 
    /* 3つの点のアニメーション */
                                      /*display: flex;この要素をフレックスコンテナ（Flexbox）に変えます。中に含まれる子要素（アニメーションの点や輪など）の配置を
                                                     簡単にコントロールできるようになります。
                                      justify-content: center;中の子要素を、水平方向（主軸）の真ん中に集めて配置します。
                                      margin-bottom: 20px;このローディング領域自体の**下に20pxの隙間（外側余白）**を空けます。これにより、
                                                          下部に続くテキストやコンテンツとくっついてしまうのを防ぎます*/  
    .loader {                                    
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }
                                               
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }

                                   /*@keyframes bounce: bounce（バウンス）という名前のアニメーションを定義します。
                                    from { transform: translateY(0); }: アニメーションの開始時点（0%）では、要素を元の位置（Y軸方向に0）に配置します。
                                    to { transform: translateY(-30px); }: アニメーションの終了時点（100%）では、要素を上方向に30ピクセル移動させます*/
     #loading p {
    font-size: 60px;
  }
  </style>
</head>

<body>

   <!-- ▼ 注意事項（最初に表示） -->
<div id="notice" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
">
  <div style="
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 85%;
    text-align: left;
    font-size: 40px;
    line-height: 1.6;
  ">
    <h2 style="text-align:center;">ご利用前の注意事項</h2>
    <p>・予約は乗車日の<span style="color:red;">前日午後３時まで</span> にお願いします</p>
    <p>・（月曜に乗車の時は土曜の午後３時まで）</p>
    <p>・予約は必ず<span style="color:red;"> ご自身のスマホ</span>で行ってください</p>
    <p>・初回予約時は教習生番号の打ち間違いに気をつけて下さい</p>

    <button id="notice-ok" style="
      margin-top: 20px;
      width: 100%;
      padding: 30px;
      font-size: 40px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
    ">OK</button>
  </div>
</div>

  
  <!-- ローディング表示（最初は非表示） -->
  <div id="loading">
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
    <p>読み込み中です…</p>
  </div>

  <script>                                    /*コンピュータに特定の処理を実行させるための「簡易的なプログラム」や「命令を記述したテキストファイル*/

    const LIFF_ID = "2010140886-GXbWv0ge";   /*const⇒constant（定数・不変）」に由来するプログラミング用語です。一度設定した値を後から変更（再代入）できない変数*/

    const GAS_URL = "https://script.google.com/macros/s/AKfycbz-xARQTZYXej12qnoawoB8LuQFs5Z6QxiZlMdw3Af4eILFvc9k7nLdGzYXypu77FQL/exec";

    // ▼ ページ読み込み時に LIFF を初期化する
window.onload = async () => {
  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }
};

    async function main() {

  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode") || "";

  console.log("mode=", mode);

  document.getElementById("loading").style.display = "block";

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const profile = await liff.getProfile();
  const userId = profile.userId;

  // ★ mode=cancel の場合は cancel.html に遷移
  if (mode === "cancel") {
    const url = GAS_URL + "?mode=cancel&userId=" + encodeURIComponent(userId);
    const res = await fetch(url);
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
    return;
  }

  // ★ 登校・下校の処理
  const url = GAS_URL
    + "?userId=" + encodeURIComponent(userId)
    + "&mode=" + encodeURIComponent(mode);

  const res = await fetch(url);
  const data = await res.json();

  document.getElementById("loading").style.display = "none";

  if (data.prefillUrl) {
    liff.openWindow({ url: data.prefillUrl, external: true });
    liff.closeWindow();
  } else {
    alert("IDが取得できません");
  }
}

       // 注意事項を閉じたら main() を実行
document.getElementById("notice-ok").onclick = () => {
  document.getElementById("notice").style.display = "none";
  
  main();
};

 </script>

 
</body>
     


</html>
