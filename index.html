<!DOCTYPE html>      
<html lang="ja">       
<head>                  
  <meta charset="UTF-8"> 
  <title>SB予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
      display: none; /* ← 最初は非表示（重要） */
    }

    #loading { display: none; }

    .loader {                                    
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }
    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }

    #loading p { font-size: 60px; }

    /* 注意事項ポップアップ */
    .notice-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .notice-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 85%;
      text-align: left;
      font-size: 40px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- 通常予約の注意事項 -->
  <div id="notice-normal" class="notice-modal">
    <div class="notice-content">
      <h2 style="text-align:center;">ご利用前の注意事項</h2>
      <p>・予約は乗車日の<span style="color:red;">前日午後３時まで</span> にお願いします</p>
      <p>・（月曜に乗車の時は土曜の午後３時まで）</p>
      <p>・予約は必ず<span style="color:red;"> ご自身のスマホ</span>で行ってください</p>
      <p>・初回予約時は教習生番号の打ち間違いに気をつけて下さい</p>
      <p style="font-size: 26px; color: #007BFF;">※利用をやめる時は、必ずキャンセルを入れて下さい</p>

      <button id="notice-ok" style="
        margin-top: 20px;
        width: 100%;
        padding: 30px;
        font-size: 40px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
      ">OK</button>
    </div>
  </div>

  <!-- キャンセル用の注意事項 -->
  <div id="notice-cancel" class="notice-modal">
    <div class="notice-content">
      <h2 style="text-align:center;">キャンセル時の注意事項</h2>
      <p>・キャンセルの手続きは乗車日の<span style="color:red;">前日午後３時まで</span>にお願いします</p>
      <p>・必ず<span style="color:red;">ご自身のスマホにて</span>キャンセルしてください</p>
      <p style="font-size: 26px; color: #007BFF;">※キャンセルせずに乗車されなかった場合、今後の利用をお断りする事があります</p>

      <button id="notice-cancel-ok" style="
        margin-top: 20px;
        width: 100%;
        padding: 30px;
        font-size: 40px;
        background: #f44336;
        color: white;
        border: none;
        border-radius: 8px;
      ">注意事項を確認して次へ</button>
    </div>
  </div>

  <!-- ローディング -->
  <div id="loading">
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
    <p>読み込み中です…</p>
  </div>

  <script>
    const LIFF_ID = "2010140886-GXbWv0ge";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZwsUavWWwPV1Ql-eMxQ-SzeZQde6bo9JiRduEXP_qtJvDh9EUu4e7yi2PYJAxIPq9/exec";

    // ▼ ページ読み込み時
    window.onload = async () => {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "";

      // ★ キャンセルモード
      if (mode === "cancel") {
        document.getElementById("notice-cancel").style.display = "flex";
        return; // ← ここで止める（index の中身は表示しない）
      }

      // ★ 通常予約モード
      document.body.style.display = "block";
      document.getElementById("notice-normal").style.display = "flex";

      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
    };

    // ▼ 通常予約の注意事項 → main() 実行
    document.getElementById("notice-ok").onclick = () => {
      document.getElementById("notice-normal").style.display = "none";
      main();
    };

    // ▼ キャンセル注意事項 → cancel.html へ
    document.getElementById("notice-cancel-ok").onclick = () => {
      window.location.href = "/cancel.html";
    };

    // ▼ 通常予約のメイン処理
    async function main() {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "";

      document.getElementById("loading").style.display = "block";

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const url = GAS_URL
        + "?userId=" + encodeURIComponent(userId)
        + "&mode=" + encodeURIComponent(mode);

      const res = await fetch(url);
      const data = await res.json();

      document.getElementById("loading").style.display = "none";

      if (data.prefillUrl) {
        liff.openWindow({ url: data.prefillUrl, external: true });
        liff.closeWindow();
      } else {
        alert("IDが取得できません");
      }
    }
  </script>

</body>
</html>
