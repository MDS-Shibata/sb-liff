<!DOCTYPE html>      
<html lang="ja">       
<head>                  
  <meta charset="UTF-8"> 
  <title>SB予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    /* ローディング全体（最初は非表示） */
    #loading {
      display: none;
    }
                 
    /* 3つの点のアニメーション */
    .loader {                                    
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }
                                               
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }

     #loading p {
    font-size: 60px;
  }

  /* 【追加】注意事項の共通ポップアップ用スタイル設定 */
  .notice-modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none; /* 初期状態ではどちらも非表示にしてJavaScriptで制御します */
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .notice-content {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 85%;
    text-align: left;
    font-size: 40px;
    line-height: 1.6;
  }
  .notice-btn {
    margin-top: 20px;
    width: 100%;
    padding: 30px;
    font-size: 40px;
    color: white;
    border: none;
    border-radius: 8px;
  }
  </style>
</head>

<body>

  <div id="notice-normal" class="notice-modal">
    <div class="notice-content">
      <h2 style="text-align:center;">ご利用前の注意事項</h2>
      <p>・予約は乗車日の<span style="color:red;">前日午後３時まで</span> にお願いします</p>
      <p>・（月曜に乗車の時は土曜の午後３時まで）</p>
      <p>・予約は必ず<span style="color:red;"> ご自身のスマホ</span>で行ってください</p>
      <p>・初回予約時は教習生番号の打ち間違いに気をつけて下さい</p>
      <p style="font-size: 26px; color: #007BFF;">※利用をやめる時は、必ずキャンセルを入れて下さい</p>
       

      <button id="notice-ok" style="
        margin-top: 20px;
        width: 100%;
        padding: 30px;
        font-size: 40px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
      ">OK</button>
    </div>
  </div>

  <div id="notice-cancel" class="notice-modal">
    <div class="notice-content">
      <h2 style="text-align:center;">キャンセル時の注意事項</h2>
      <p>・キャンセルの手続きは乗車日の<span style="color:red;">前日午後３時まで</span>にお願いします</p>
      <p>・必ず<span style="color:red;">ご自身のスマホにて</span>キャンセルしてください</p>
      <p style="font-size: 26px; color: #007BFF;">※キャンセルせずに乗車されなかった場合、今後の利用をお断りする事があります</p>

      <button id="notice-cancel-ok" class="notice-btn" style="background: #f44336;">注意事項を確認して次へ</button>
    </div>
  </div>

  
  <div id="loading">
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
    <p>読み込み中です…</p>
  </div>

  <script>                                    /*コンピュータに特定の処理を実行させるための「簡易的なプログラム」や「命令を記述したテキストファイル*/

    const LIFF_ID = "2010140886-GXbWv0ge";   /*const⇒constant（定数・不変）」に由来するプログラミング用語です。一度設定した値を後から変更（再代入）できない変数*/

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxCNn6Mi_VEABQBR2gRYOya2y96ceWzG1X_z4HSE-RRgkWfEPQWP5aNbhxf4Fr0ScvV/exec";

    // ▼ ページ読み込み時に LIFF を初期化する
window.onload = async () => {
  // URLのパラメータから mode（cancelなど）を取得する
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode") || "";

  // ★ modeがcancelの時はキャンセル用の注意事項を表示、それ以外は通常の注意事項を表示
 // ★ キャンセル画面へ行くときは index の中身を一切表示しない
  if (mode === "cancel") {
    // 注意事項だけ表示
    document.getElementById("notice-cancel").style.display = "flex";
    return; // ← ここで止める（body は表示しない）
  }

  // ★ 通常予約のときだけ body を表示
  document.body.style.display = "block";
  document.getElementById("notice-normal").style.display = "flex";

  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }
};

    async function main() {

  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode") || "";

  console.log("mode=", mode);

  document.getElementById("loading").style.display = "block";

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const profile = await liff.getProfile();
  const userId = profile.userId;

  // ★ mode=cancel の場合は cancel.html に遷移
if (mode === "cancel") {
  window.location.href = "/cancel.html";
  return;
}



  // ★ 登校・下校の処理
  const url = GAS_URL
    + "?userId=" + encodeURIComponent(userId)
    + "&mode=" + encodeURIComponent(mode);

  const res = await fetch(url);
  const data = await res.json();

  document.getElementById("loading").style.display = "none";

  if (data.prefillUrl) {
    liff.openWindow({ url: data.prefillUrl, external: true });
    liff.closeWindow();
  } else {
    alert("IDが取得できません");
  }
}

// 通常予約の注意事項を閉じたら main() を実行
document.getElementById("notice-ok").onclick = () => {
  document.getElementById("notice-normal").style.display = "none";
  main();
};

// ★【追加】キャンセル用の注意事項を閉じたら直接 cancel.html に移動させるための処理
document.getElementById("notice-cancel-ok").onclick = () => {
  document.getElementById("notice-cancel").style.display = "none";
  window.location.href = "/cancel.html";
};

 </script>

</body>
