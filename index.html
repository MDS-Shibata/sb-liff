<!DOCTYPE html>      
<html lang="ja">       
<head>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    #loading { display: none; }

    .loader {                                    
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }
    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }

    #loading p { font-size: 60px; }

    /* 注意事項ポップアップ */
    .notice-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .notice-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 85%;
      text-align: left;
      font-size: 40px;
      line-height: 1.6;
    }
  </style>
</head>

        border-radius: 8px;
      ">注意事項を確認して次へ</button>
    </div>
  </div>
