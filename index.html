<!DOCTYPE html>         
<html lang="ja">       
<head>                  
  <meta charset="UTF-8"> 
  <title>SB予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    /* ローディング全体（最初は非表示） */
    #loading {
      display: none;
    }
                 
    /* 3つの点のアニメーション */
    .loader {                                    
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loader span {
      width: 30px;
      height: 30px;
      margin: 0 10px;
      background: #333;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }
                                               
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-30px); }
    }

     #loading p {
    font-size: 60px;
  }

  /* 【追加】注意事項の共通ポップアップ用スタイル設定 */
  .notice-modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none; /* 初期状態ではどちらも非表示にしてJavaScriptで制御します */
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .notice-content {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 85%;
    text-align: left;
    font-size: 40px;
    line-height: 1.6;
  }
  .notice-btn {
    margin-top: 20px;
    width: 100%;
    padding: 30px;
    font-size: 40px;
    color: white;
    border: none;
    border-radius: 8px;
  }
  </style>
</head>

<body>

  <div id="notice-normal" class="notice-modal">
    <div class="notice-content">
      <h2 style="text-align:center;">ご利用前の注意事項</h2>
      <p>・予約は乗車日の<span style="color:red;">前日午後３時まで</span> にお願いします</p>
      <p>・（月曜に乗車の時は土曜の午後３時まで）</p>
      <p>・予約は必ず<span style="color:red;"> ご自身のスマホ</span>で行ってください</p>
      <p>・初回予約時は教習生番号の打ち間違いに気をつけて下さい</p>
      <p style="font-size: 26px; color: #007BFF;">※利用をやめる時は、必ずキャンセルを入れて下さい</p>
       

      <button id="notice-ok" style="
        margin-top: 20px;
        width: 100%;
        padding: 30px;
        font-size: 40px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
      ">OK</button>
    </div>
  </div>

  <div id="notice-cancel" class="notice-modal">
    <div class="notice-content">
      <h2 style="text-align:center;">キャンセル時の注意事項</h2>
      <p>・キャンセルの手続きは乗車日の<span style="color:red;">前日午後３時まで</span>にお願いします</p>
      <p>・必ず<span style="color:red;">ご自身のスマホにて</span>キャンセルしてください</p>
      <p style="font-size: 26px; color: #007BFF;">※キャンセルせずに乗車されなかった場合、今後の利用をお断りする事があります</p>

      <button id="notice-cancel-ok" class="notice-btn" style="background: #f44336;">注意事項を確認して次へ</button>
    </div>
  </div>

  
  <div id="loading">
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
    <p>読み込み中です…</p>
  </div>

  <script>                                    /*コンピュータに特定の処理を実行させるための「簡易的なプログラム」や「命令を記述したテキストファイル*/

    <script>
    const LIFF_ID = "2010140886-GXbWv0ge";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwsJ7SEDmz1MDsFUQNAS2CduVCLKA3LojxYPV4WJnm_nIapXMog2BgvPwERucJC52wx/exec";

    // ユーザーのLINEユーザーIDを保持する変数
    let globalUserId = "";

    // ▼ ページ読み込み時に最初に実行する処理
    window.onload = async () => {
      // 1. まずローディングを表示
      document.getElementById("loading").style.display = "block";

      try {
        // 2. LINEのLIFF初期化を確実に実行
        await liff.init({ liffId: LIFF_ID });

        // 3. ログインしていなければログインさせる
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 4. 確実にプロフィール（userId）を取得しておく
        const profile = await liff.getProfile();
        globalUserId = profile.userId;

        // 5. 初期化とログインが終わったのでローディングを一旦消す
        document.getElementById("loading").style.display = "none";

        // 6. URLのパラメータから mode を取得して分岐
        const params = new URLSearchParams(window.location.search);
        const mode = params.get("mode") || "";

        if (mode === "cancel") {
          // キャンセルモードなら、キャンセル用ポップアップを表示
          document.getElementById("notice-cancel").style.display = "flex";
        } else {
          // 通常予約なら、通常用ポップアップを表示
          document.body.style.display = "block";
          document.getElementById("notice-normal").style.display = "flex";
        }

      } catch (err) {
        console.error("LIFF初期化エラー:", err);
        alert("LINEとの通信に失敗しました。時間をおいて再度お試しください。");
      }
    };

    // ★ 通常予約の処理（「OK」ボタンを押した後に実行）
    async function main() {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "";

      // 画面を読み込み中にする
      document.getElementById("loading").style.display = "block";

      // GASへ通信して予約フォームのURLを取得
      const url = GAS_URL
        + "?userId=" + encodeURIComponent(globalUserId)
        + "&mode=" + encodeURIComponent(mode);

      try {
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById("loading").style.display = "none";

        if (data.prefillUrl) {
          liff.openWindow({ url: data.prefillUrl, external: true });
          liff.closeWindow();
        } else {
          alert("予約用URLの取得に失敗しました。");
        }
      } catch (e) {
        document.getElementById("loading").style.display = "none";
        alert("通信エラーが発生しました。");
      }
    }

    // 通常予約の注意事項を閉じたら main() を実行
    document.getElementById("notice-ok").onclick = () => {
      document.getElementById("notice-normal").style.display = "none";
      main();
    };

    // キャンセル用の注意事項を閉じたら cancel.html に移動
    document.getElementById("notice-cancel-ok").onclick = () => {
      document.getElementById("notice-cancel").style.display = "none";
      window.location.href = "/cancel.html";
    };
  </script>
