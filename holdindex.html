  <div id="cancel-main-view" style="display: none; padding: 20px;">

  <script>
    const LIFF_ID = "2010140886-GXbWv0ge";
    // 💡 ご自身の最新のGAS URLになっていることをご確認ください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwQgA3k6kEgPz8AEHB1q4rKBD-Ie-qW7eHhNcb60gsDY-GjkPh_sEW4d_Y-Fdw2PYvk/exec";
    
    let globalUserId = "";

    window.onload = async () => {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "";

      document.body.style.display = "none";

      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      globalUserId = profile.userId;

      if (mode === "cancel") {
        document.body.style.display = "block";
        document.getElementById("notice-cancel").style.display = "flex";
        return;
      }

      document.body.style.display = "block";
      document.getElementById("notice-normal").style.display = "flex";
    };

    document.getElementById("notice-ok").onclick = () => {
      document.getElementById("notice-normal").style.display = "none";
      mainNormal();
    };

    document.getElementById("notice-cancel-ok").onclick = () => {
      document.getElementById("notice-cancel").style.display = "none";
      showCancelList();
    };
    
     function mainNormal() {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "";

      document.getElementById("loading").style.display = "block";

      // 💡 セキュリティ制限を完全に回避するためのコールバック関数を一時的に作る
      const callbackName = "jsonp_callback_" + Math.round(100000 * Math.random());
      window[callbackName] = function(data) {
        document.getElementById("loading").style.display = "none";
        if (data && data.prefillUrl) {
          liff.openWindow({ url: data.prefillUrl, external: false });
        } else {
          alert("GASからURLが返されませんでした。データを確認してください。");
        }
        // 後片付け
        delete window[callbackName];
        document.body.removeChild(script);
      };

      // URLの組み立て
      const url = GAS_URL
       + "?userId=" + encodeURIComponent(globalUserId)
       + "&mode=" + encodeURIComponent(mode)
       + "&callback=" + callbackName;

      // 💡 fetchを使わず、scriptタグを使って通信することでCORS制限を100%回避します
      const script = document.createElement("script");
      script.src = url;
      script.onerror = function() {
        document.getElementById("loading").style.display = "none";
        alert("GASとの通信に失敗しました。URLまたはデプロイ設定を確認してください。");
      };
      document.body.appendChild(script);
    }

    async function showCancelList() {
      document.getElementById("cancel-main-view").style.display = "block";
      document.getElementById("loading").style.display = "block";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            mode: "cancel",
            userId: globalUserId
          })
        });

        const reservations = await res.json();
        document.getElementById("loading").style.display = "none";

        if (reservations.errorMessage) {
          alert("GAS側のエラー: " + reservations.errorMessage);
          return;
        }

        const list = document.getElementById("list");

        if (!reservations || reservations.length === 0) {
          list.innerHTML = "<p style='font-size:40px; margin-top:40px;'>現在キャンセルできる予約はありません。</p>";
          return;
        }

        list.innerHTML = `
          <div style="margin-bottom: 40px;font-size: 40px;">
            <h3 style="background:#7fffd4; padding:10px;">登校予約</h3>
            <table border="1" style="width:100%; border-collapse:collapse;">  
              <thead>
                <tr style="background:#f8f8f8;">
                     <th style="font-weight:300; font-size:30px;">✓</th>      
                     <th style="font-weight:300; font-size:30px;">乗車日</th>
                     <th style="font-weight:300; font-size:30px;">車校着</th>
                     <th style="font-weight:300; font-size:30px;">乗車バス停</th>
                </tr>
              </thead>
              <tbody id="toSchoolList"></tbody>
            </table>
          </div>

          <div style="margin-bottom: 40px;font-size: 40px;">
            <h3 style="background:#87cefa; padding:10px;">下校予約</h3>
            <table border="1" style="width:100%; border-collapse:collapse;">
              <thead>
                <tr style="background:#f8f8f8;">
                     <th style="font-weight:300; font-size:30px;">✓</th>      
                     <th style="font-weight:300; font-size:30px;">乗車日</th>
                     <th style="font-weight:300; font-size:30px;">車校発</th>
                     <th style="font-weight:300; font-size:30px;">降車バス停</th>
                </tr>
              </thead>
              <tbody id="fromSchoolList"></tbody>
            </table>
          </div>
        `;

        const toSchoolList = document.getElementById("toSchoolList");
        const fromSchoolList = document.getElementById("fromSchoolList");

        reservations.forEach((r) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><input type="checkbox" class="chk" data-sheet="${r.sheetName}" data-row="${r.row}"></td>
            <td>${r.rideDate}</td>
            <td>${r.time || ""}</td>
            <td>${r.place}</td>
          `;

          if (r.sheetName.includes("登校")) {
            toSchoolList.appendChild(row);
          } else if (r.sheetName.includes("下校")) {
            fromSchoolList.appendChild(row);
          }
        });

        document.getElementById("cancelBtn").style.display = "block";

      } catch (err) {
        document.getElementById("loading").style.display = "none";
        alert("エラー詳細: " + err.message);
      }
    }

    document.addEventListener("change", (e) => {
      if (e.target.classList.contains("chk")) {
        const tr = e.target.closest("tr");
        if (e.target.checked) {
          tr.classList.add("tr-selected");
        } else {
          tr.classList.remove("tr-selected");
        }
      }
    });

    // 💡 変更：キャンセルボタンが押されたら「自作のポップアップ」をフワッと出す
    document.getElementById("cancelBtn").onclick = () => {
      const checks = document.querySelectorAll(".chk:checked");
      if (checks.length === 0) {
        alert("キャンセルする予約を選択してください。");
        return;
      }
      // 「はい/いいえ」の画面を表示
      document.getElementById("custom-confirm-modal").style.display = "flex";
    };

    // 💡 新しく追加：「いいえ」が押されたらポップアップを閉じるだけ
    document.getElementById("confirm-no").onclick = () => {
      document.getElementById("custom-confirm-modal").style.display = "none";
    };

    // 💡 新しく追加：「はい」が押されたら実際のキャンセル処理へ進む
    document.getElementById("confirm-yes").onclick = async () => {
      document.getElementById("custom-confirm-modal").style.display = "none"; // ポップアップを閉じる
      document.getElementById("cancel-main-view").style.display = "none";
      document.getElementById("loading").style.display = "block";

      const checks = document.querySelectorAll(".chk:checked");
      const targets = [];
      checks.forEach(c => {
        targets.push({
          sheetName: c.dataset.sheet,
          row: Number(c.dataset.row)
        });
      });

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            mode: "cancelExec",
            userId: globalUserId,
            targets: targets
          })
        });

        const json = await res.json();

        if (json.success) {
          alert("キャンセルが完了しました。");
          liff.closeWindow();
        } else {
          alert("キャンセルに失敗しました。");
          document.getElementById("cancel-main-view").style.display = "block";
          document.getElementById("loading").style.display = "none";
        }

      } catch (err) {
        alert("通信エラーが発生しました。");
        document.getElementById("cancel-main-view").style.display = "block";
        document.getElementById("loading").style.display = "none";
      }
    };
  </script>
</body>
